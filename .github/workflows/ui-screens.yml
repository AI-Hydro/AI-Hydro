name: UI Screens

# Renders the fixture-backed UI screens headlessly and checks the structural budget.
# The harness itself is offline: all non-local traffic is answered from fixtures.
# Pixel diffs need local baselines (not committed), so CI runs with --no-pixel.

on:
  pull_request:
    branches: [main, "vision2040/**"]
    paths:
      - "webview-ui/**"
      - "scripts/ui-screens/**"
      - "src/shared/**"
      - "proto/**"
      - ".github/workflows/ui-screens.yml"
  workflow_dispatch:

permissions:
  contents: read

# The render matrix is split over SHARD_COUNT shards (run.mjs --shard i/n: screens sorted by id, striped by index).
# To add capacity, raise the matrix `shard` list and SHARD_COUNT together; check-shard-coverage fails if they disagree.
env:
  SHARD_COUNT: 4

jobs:
  # One-time guards: they do not depend on the matrix, so they run once, not per shard.
  guards:
    name: Budget and bundle guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Checker budget may only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/ui-screens/check-budget-monotonic.mjs --base "origin/$BASE_REF"

      - name: Install dependencies
        run: |
          npm ci
          cd webview-ui && npm ci

      - name: Generate protos
        run: npm run protos

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Harness assertion self-test
        run: npm run ui:screens:selftest

      - name: Build webview
        run: npm run build:webview

      - name: Production bundle must not contain the UI harness
        run: npm run ui:screens:verify-bundle

      - name: Webview bundle must not contain upstream or unsafe-install strings
        run: node scripts/check-bundle-leaks.mjs --target webview

      # Independent listing of the registry, compared by the aggregator against what the shards covered.
      - name: List registered screens
        run: node scripts/ui-screens/run.mjs --out "$RUNNER_TEMP/ui-screens-list" --list "$RUNNER_TEMP/registry.json"

      - name: Upload screen registry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screens-registry
          path: ${{ runner.temp }}/registry.json
          retention-days: 7

  render:
    name: Screens shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # About 15 min per shard at 4 shards (the matrix is about 714 cells, 15 s per cell on a slow runner).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd webview-ui && npm ci

      - name: Generate protos
        run: npm run protos

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Render screens and enforce the checker budget (shard ${{ matrix.shard }})
        run: >-
          node scripts/ui-screens/run.mjs
          --out "$RUNNER_TEMP/ui-screens"
          --shard "${{ matrix.shard }}/$SHARD_COUNT"
          --themes dark,hc-light
          --widths 400,800,1280
          --font 13
          --workers 2
          --check
          --require-matrix-budget
          --no-pixel

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screens-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-screens
          retention-days: 7

      - name: Upload shard coverage record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screens-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-screens/shard.json
          if-no-files-found: error
          retention-days: 7

  # Keeps the original check name, so anything that requires "Screens, budget and bundle guard" still gates the PR.
  # It fails if any upstream job failed, was cancelled or was skipped, and proves every registered screen ran in a shard.
  ui-screens:
    name: Screens, budget and bundle guard
    if: ${{ always() }}
    needs: [guards, render]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every upstream job must have succeeded
        env:
          GUARDS: ${{ needs.guards.result }}
          RENDER: ${{ needs.render.result }}
        run: |
          echo "guards=$GUARDS render=$RENDER"
          [ "$GUARDS" = success ] && [ "$RENDER" = success ]

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Download screen registry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-screens-registry
          path: ${{ runner.temp }}/registry

      - name: Download shard coverage records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-screens-coverage-shard-*
          path: ${{ runner.temp }}/coverage

      - name: Every registered screen was covered by exactly one shard
        run: >-
          node scripts/ui-screens/check-shard-coverage.mjs
          --registry "$RUNNER_TEMP/registry/registry.json"
          --shards "$RUNNER_TEMP/coverage"
          --expect-shards "$SHARD_COUNT"
