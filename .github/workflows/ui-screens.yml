name: UI Screens

# Renders the fixture-backed UI screens headlessly and checks the structural budget.
# The harness itself is offline: all non-local traffic is answered from fixtures.
# Pixel diffs need local baselines (not committed), so CI runs with --no-pixel.

on:
  pull_request:
    branches: [main, "vision2040/**"]
    paths:
      - "webview-ui/**"
      - "scripts/ui-screens/**"
      - "src/shared/**"
      - "proto/**"
      - ".github/workflows/ui-screens.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-screens:
    name: Screens, budget and bundle guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Checker budget may only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/ui-screens/check-budget-monotonic.mjs --base "origin/$BASE_REF"

      - name: Install dependencies
        run: |
          npm ci
          cd webview-ui && npm ci

      - name: Generate protos
        run: npm run protos

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build webview
        run: npm run build:webview

      - name: Production bundle must not contain the UI harness
        run: npm run ui:screens:verify-bundle

      - name: Render screens and enforce the checker budget
        run: >-
          node scripts/ui-screens/run.mjs
          --out "$RUNNER_TEMP/ui-screens"
          --themes dark,hc-light
          --widths 400,800,1280
          --font 13
          --workers 2
          --check
          --require-matrix-budget
          --no-pixel

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screens
          path: ${{ runner.temp }}/ui-screens
          retention-days: 7
