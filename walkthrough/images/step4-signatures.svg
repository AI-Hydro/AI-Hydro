	<text x="105.0" y="127.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#bfe3f7">from step 3</text>
	<path d="M180 110 L212 110" stroke="#5fb3e6" stroke-width="2" fill="none"/>
	<path d="M212 105 L220 110 L212 115 Z" fill="#5fb3e6"/>
	<rect x="220" y="70" width="215" height="80" rx="8" fill="#17476e" stroke="#5fb3e6" stroke-width="1.5"/>
	<text x="327.5" y="108.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">extract_hydrological_signatures</text>
	<text x="327.5" y="127.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#bfe3f7">recorded as a run</text>
	<path d="M435 110 L462 110" stroke="#5fb3e6" stroke-width="2" fill="none"/>
